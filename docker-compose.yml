services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - todo-db-data:/var/lib/postgresql
  app:
    build:
      context: .
      dockerfile: TodoApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=tododb;Username=todouser;Password=todopass"
      Jwt__Key: "DockerComposeLocalDevKey1234567890abcdef"
      Jwt__Issuer: "TodoApi"
      Jwt__Audience: "TodoApiUsers"
    depends_on:
      - db
volumes:
  todo-db-data: